<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="flame" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#D92600" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="50%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Diya Base / Terracotta Bowl -->
  <path d="M12 40 C14 54, 50 54, 52 40 C52 38, 12 38, 12 40 Z" fill="url(#bowl)" stroke="#EA580C" stroke-width="1.5"/>
  <ellipse cx="32" cy="40" rx="20" ry="3.5" fill="#7C2D12" stroke="#F59E0B" stroke-width="1"/>
  <circle cx="32" cy="39" r="1.5" fill="#FCD34D"/>
  <!-- Diya Flame -->
  <path d="M32 10 C36 20, 42 27, 40 34 C38 39, 26 39, 24 34 C22 27, 28 20, 32 10 Z" fill="url(#flame)" filter="url(#glow)"/>
  <!-- Hot Inner Core -->
  <path d="M32 20 C34 25, 36 29, 35 34 C34 37, 30 37, 29 34 C28 29, 30 25, 32 20 Z" fill="#FFFFFF" opacity="0.95"/>
</svg>

